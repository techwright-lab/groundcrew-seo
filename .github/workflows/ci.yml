name: Groundcrew CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install.sh scripts/smoke.sh scripts/preview-publishers.sh tests/test.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/groundcrew-doctor.py scripts/generate-adapters.py scripts/validate-distribution.py scripts/gen-contract.py scripts/validate-skills.py
      - name: Contracts, installer safety, and drift tests
        run: ./tests/test.sh
      - name: Plugin packaging contracts
        run: python3 tests/test_plugin_packaging.py
      - name: Build skills-only plugin ZIP
        run: python3 scripts/build-plugin.py
